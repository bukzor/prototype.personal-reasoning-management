name = "Ledger"
version = "0.1.0"
defaultTargets = ["Ledger", "Corpus"]
testDriver = "test"
# Batteries ships the driver; it auto-detects the root modules of our default
# targets, so there is nothing of ours to maintain.
lintDriver = "batteries/runLinter"

# Pinned to the tag matching lean-toolchain, not `main`: the manifest is the
# record, and a floating rev makes every fetch a fresh trust decision.
[[require]]
name = "batteries"
scope = "leanprover-community"
rev = "v4.32.0"

[[lean_lib]]
name = "Ledger"

# Neither is in defaultTargets: `lake build` stays the corpus check, `lake test`
# the harness. CI runs both.
[[lean_lib]]
name = "Test"
globs = ["Test.+"]

[[lean_exe]]
name = "test"
root = "Test.Main"

# The generated record (UNTRUSTED_XLATE). In defaultTargets so `lake build`
# elaborates the corpus — building is checking.
[[lean_lib]]
name = "Corpus"
globs = ["Corpus.+"]

# Not a defaultTarget; the lib exists so the exes' in-package imports get
# built (same gotcha as Test).
[[lean_lib]]
name = "Gen"
globs = ["Gen.+"]

[[lean_exe]]
name = "gen"
root = "Gen.Main"

# The round-trip audit (UNTRUSTED_XLATE): prints the compiled value back to
# canonical frontmatter and byte-compares the authored surface.
[[lean_exe]]
name = "roundtrip"
root = "Gen.Print"
